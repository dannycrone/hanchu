import_statistics:
  name: Import historical statistics
  description: >
    Backfill energy and power statistics from the Hanchu cloud for a date range.
    One API call is made per day (two if include_power is enabled), so large ranges
    may take several minutes. Use yesterday or earlier as the end date to ensure
    complete daily totals. Imports: Solar Generation, Grid Import/Export,
    Battery Charge/Discharge, Load. With include_power: Solar Power, Battery Power,
    Grid Power, Load Power (hourly averages for the Power Sources chart).
  fields:
    start_date:
      name: Start date
      description: First day to import (inclusive). Use your system installation date.
      required: true
      example: "2026-01-01"
      selector:
        date:
    end_date:
      name: End date
      description: Last day to import (inclusive). Use yesterday for complete data.
      required: true
      example: "2026-02-25"
      selector:
        date:
    include_power:
      name: Include power (W) statistics
      description: >
        Also fetch minute-by-minute power data and import hourly averages.
        Populates the Energy Dashboard "Power Sources" graph for historical dates.
        Doubles the number of API calls — avoid for very large date ranges.
      required: false
      default: false
      selector:
        boolean:

fast_charge_discharge:
  name: Fast charge/discharge
  description: >
    Start or stop Hanchu fast charge or fast discharge on an inverter.
    Duration is required for fast_charge and fast_discharge, and ignored for stop actions.
  fields:
    action:
      name: Action
      description: Fast charge/discharge command to send.
      required: true
      example: "fast_charge"
      selector:
        select:
          options:
            - label: Fast charge
              value: fast_charge
            - label: Fast discharge
              value: fast_discharge
            - label: Stop fast charge
              value: stop_fast_charge
            - label: Stop fast discharge
              value: stop_fast_discharge
    duration_minutes:
      name: Duration
      description: Duration in minutes for fast charge/discharge start actions.
      required: false
      example: 10
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: minutes
          mode: box
    inverter_sn:
      name: Inverter serial number
      description: Required only when more than one Hanchu inverter is configured.
      required: false
      example: "H03XXXXXXXXXX"
      selector:
        text:
